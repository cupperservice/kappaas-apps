apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    notifications/channel: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/cupperservice/kappaas-apps.git
    path: charts/argocd
    targetRevision: main
    helm:
      # helm install 時のリリース名。リソース名（argocd-server など）を変えないため
      releaseName: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD 自身なので自動同期にしない（Diff を確認してから手動で Sync。手順は argocd-self-managed.md）
  # finalizer も付けない（Application を消しても Argo CD 本体は残す）
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
