apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/cupperservice/kappaas-apps.git
    path: charts/cloudflare-tunnel
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-tunnel
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
    - group: ""
      kind: Secret
      name: cloudflare-tunnel-credentials
      jsonPointers:
        - /data
        - /metadata/annotations
        - /metadata/labels
        - /metadata/ownerReferences
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
