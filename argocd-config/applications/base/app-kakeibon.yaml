# 業務アプリ kakeibon（マニフェストは services/kakeibon。以前は kakeibon-apps リポジトリの components）
# path・targetRevision は overlays/<env>/patches/app-kakeibon-patch.yaml で環境ごとに決める
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-kakeibon
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: kakeibon
  project: default
  source:
    repoURL: https://github.com/cupperservice/kappaas-apps.git
    path: services/kakeibon/overlays/prod
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 開発クラスタには kakeibon の Namespace が無いため（本番は既にある）
      - CreateNamespace=true
