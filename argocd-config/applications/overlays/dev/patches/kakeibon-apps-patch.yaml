# 業務アプリも dev ブランチを同期する
# sources はリストなので丸ごと置き換わる（repoURL・path も書く）
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-kakeibon
  namespace: argocd
spec:
  sources:
    - path: components
      repoURL: https://github.com/cupperservice/kakeibon-apps.git
      targetRevision: dev
