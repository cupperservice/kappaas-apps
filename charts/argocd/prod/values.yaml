# 本番クラスタ用（values.yaml に重ねる）
argo-cd:
  configs:
    cm:
      url: https://argocd.local
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: Ov23li3cq07Nri2Q1XoI
              clientSecret: $dex.github.clientSecret
              redirectURI: https://argocd.local/api/dex/callback
  # サーバー証明書のホスト名（values.yaml の server.certificate）
  server:
    certificate:
      domain: argocd.local
