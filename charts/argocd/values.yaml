# prod / dev 共通の値。環境ごとの値は prod/values.yaml・dev/values.yaml
argo-cd:
  configs:
    cm:
      admin.enabled: "false"
    rbac:
      policy.default: role:readonly
      scopes: '[groups, email]'
      policy.csv: |
        g, cupper@mac.com, role:admin
    # argocd-secret（dex.github.clientSecret・server.secretkey）はチャートで作らず、
    # bootstrap/argocd-dex-secret*.yaml で投入した既存の Secret を使う（秘密情報を Git に入れない）
    secret:
      createSecret: false
  # argocd-server のサーバー証明書を cert-manager（クラスタの CA k8s-ca）で発行する（Secret argocd-server-tls）
  # argocd-server は argocd-server-tls があれば自動でそれを使う。無いと自己署名（O=Argo CD）になり、ブラウザで警告が出る
  # ホスト名（domain）は環境ごとに prod/values.yaml・dev/values.yaml。Mac で k8s-ca を信頼する手順は docs/setup/06-gitops.md の 7
  server:
    certificate:
      enabled: true
      issuer:
        kind: ClusterIssuer
        name: k8s-ca
      duration: 2160h
      renewBefore: 360h
      usages:
        - server auth
        - digital signature
        - key encipherment
