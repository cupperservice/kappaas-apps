apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-on-prem-ca
  secretName: k8s-ca-secret
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
