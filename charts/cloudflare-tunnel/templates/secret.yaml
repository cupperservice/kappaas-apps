apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cloudflare-tunnel-secret-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cloudflare-tunnel-secret-store
    kind: SecretStore
  target:
    name: cloudflare-tunnel-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        credentials.json: '{"AccountTag":"{{ .account }}","TunnelSecret":"{{ .tunnelSecret }}","TunnelID":"{{ .tunnelId }}"}'
  data:
    - secretKey: account
      remoteRef:
        key: kappaas-apps/cloudflare/account
    - secretKey: tunnelId
      remoteRef:
        key: kappaas-apps/cloudflare/tunnelId
    - secretKey: tunnelSecret
      remoteRef:
        key: kappaas-apps/cloudflare/tunnelSecret
