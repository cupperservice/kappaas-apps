# prod / dev 共通の値。トンネルの設定は prod/values.yaml（開発クラスタには入れない）
cloudflare-tunnel:
  replicaCount: 2
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflare-tunnel
