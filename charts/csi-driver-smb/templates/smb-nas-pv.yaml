apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-smb-nas-k8s-disk-1
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - vers=3.0
    - guest
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: 192.168.3.10/k8s-disk-1
    volumeAttributes:
      source: "//192.168.3.10/k8s-disk-1"
    nodeStageSecretRef:
      name: smb-nas-secret
      namespace: kube-system
