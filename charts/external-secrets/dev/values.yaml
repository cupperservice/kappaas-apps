# 開発クラスタ（altair）用（values.yaml に重ねる）
# サイドカーが使う IAM Roles Anywhere の ARN（aws/rolesanywhere.yaml のスタック kappaas-dev-rolesanywhere の Outputs）
aws:
  trustAnchorArn: "arn:aws:rolesanywhere:ap-northeast-1:391726422976:trust-anchor/f02a3107-66e5-445f-8cba-0af433e4b0cf"
  profileArn: "arn:aws:rolesanywhere:ap-northeast-1:391726422976:profile/5b8d5ceb-5fdb-40cb-b035-31dbc45bb3a7"
  roleArn: "arn:aws:iam::391726422976:role/KappaasDevExternalSecretsRole"

# 開発はノード 1 台なので、レプリカを 2 つにしても冗長化にならない → 1 つにする
# replicas 1 で PDB（minAvailable 1）を残すと ALLOWED DISRUPTIONS が 0 になり drain が止まるので、PDB も作らない
external-secrets:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  webhook:
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
