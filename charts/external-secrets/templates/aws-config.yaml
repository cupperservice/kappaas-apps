# サイドカー（aws_signing_helper）に渡す IAM Roles Anywhere の ARN
# 環境ごとの値は prod/values.yaml・dev/values.yaml の aws.*（aws/rolesanywhere.yaml のスタックの Outputs）
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-secrets-aws
  namespace: {{ .Release.Namespace }}
data:
  TRUST_ANCHOR_ARN: "arn:aws:rolesanywhere:ap-northeast-1:391726422976:trust-anchor/f02a3107-66e5-445f-8cba-0af433e4b0cf"
  PROFILE_ARN: "arn:aws:rolesanywhere:ap-northeast-1:391726422976:profile/5b8d5ceb-5fdb-40cb-b035-31dbc45bb3a7"
  ROLE_ARN: "arn:aws:iam::391726422976:role/KappaasDevExternalSecretsRole"
