external-secrets:
  image:
    repository: ghcr.io/external-secrets/external-secrets
  installCRDs: true
  replicaCount: 2
  leaderElect: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: external-secrets
  livenessProbe:
    enabled: true
    spec:
      port: 8082
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet:
        port: live
        path: /healthz
  readinessProbe:
    enabled: true
    spec:
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet:
        port: live
        path: /readyz
  concurrent: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
  log:
    level: info
    timeEncoding: rfc3339
  webhook:
    port: 10250
    replicaCount: 2
    failurePolicy: Fail
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-webhook
    livenessProbe:
      enabled: true
      port: 8081
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
    readinessProbe:
      enabled: true
      port: 8081
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 5
      successThreshold: 1
      initialDelaySeconds: 20
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    certManager:
      enabled: true
      addInjectorAnnotations: true
      cert:
        create: true
        issuerRef:
          name: external-secrets-selfsigned
          kind: Issuer
          group: cert-manager.io
    log:
      level: info
      timeEncoding: rfc3339
  certController:
    create: false
  processClusterExternalSecret: false
  processClusterStore: false
  processClusterPushSecret: false
  processPushSecret: false
  crds:
    createClusterExternalSecret: false
    createClusterSecretStore: false
    createClusterPushSecret: false
    createPushSecret: false
  extraEnv:
    - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
      value: "http://aws-credential-helper.aws-credential-helper.svc.cluster.local:9911"
    - name: AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE
      value: "IPv4"
