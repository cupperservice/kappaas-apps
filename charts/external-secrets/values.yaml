# prod / dev 共通の値。環境ごとの値は prod/values.yaml・dev/values.yaml
external-secrets:
  image:
    repository: ghcr.io/external-secrets/external-secrets
  installCRDs: true
  replicaCount: 2
  leaderElect: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: external-secrets
  livenessProbe:
    enabled: true
    spec:
      port: 8082
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet:
        port: live
        path: /healthz
  readinessProbe:
    enabled: true
    spec:
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
      httpGet:
        port: live
        path: /readyz
  concurrent: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
  log:
    level: info
    timeEncoding: rfc3339
  webhook:
    port: 10250
    replicaCount: 2
    failurePolicy: Fail
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: external-secrets-webhook
    livenessProbe:
      enabled: true
      port: 8081
      timeoutSeconds: 5
      failureThreshold: 5
      periodSeconds: 10
      successThreshold: 1
      initialDelaySeconds: 10
    readinessProbe:
      enabled: true
      port: 8081
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 5
      successThreshold: 1
      initialDelaySeconds: 20
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    certManager:
      enabled: true
      addInjectorAnnotations: true
      cert:
        create: true
        issuerRef:
          name: external-secrets-selfsigned
          kind: Issuer
          group: cert-manager.io
    log:
      level: info
      timeEncoding: rfc3339
  certController:
    create: false
  processClusterExternalSecret: false
  processClusterStore: false
  processClusterPushSecret: false
  processPushSecret: false
  crds:
    createClusterExternalSecret: false
    createClusterSecretStore: false
    createClusterPushSecret: false
    createPushSecret: false
  # AWS の資格情報は Pod 内のサイドカー（aws_signing_helper serve、127.0.0.1:9911）から取る
  # 仕組みは docs/operations/aws-iam.md、経緯は docs/history/2026-11-iam-roles-anywhere.md
  extraEnv:
    - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
      value: "http://127.0.0.1:9911"
    - name: AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE
      value: "IPv4"
  # extraInitContainers / extraVolumes はコントローラーの Deployment にだけ入る（webhook・certController には入らない）
  extraInitContainers:
    # aws_signing_helper を取得する
    - name: download-helper
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          wget -qO /opt/bin/aws_signing_helper \
            https://rolesanywhere.amazonaws.com/releases/1.8.2/X86_64/Linux/Amzn2023/aws_signing_helper && \
          chmod +x /opt/bin/aws_signing_helper
      volumeMounts:
        - name: bin
          mountPath: /opt/bin
    # ネイティブサイドカー（restartPolicy: Always）。startupProbe が通るまで ESO 本体は起動しない
    - name: aws-credential-helper
      image: amazonlinux:2023
      restartPolicy: Always
      # ARN は環境ごとに違うので ConfigMap（templates/aws-config.yaml）から環境変数で受け取る
      envFrom:
        - configMapRef:
            name: external-secrets-aws
      command:
        - sh
        - -c
        - |
          exec /opt/bin/aws_signing_helper serve \
            --certificate /certs/tls.crt \
            --private-key /certs/tls.key \
            --trust-anchor-arn "$TRUST_ANCHOR_ARN" \
            --profile-arn "$PROFILE_ARN" \
            --role-arn "$ROLE_ARN" \
            --port 9911
      # helper は 127.0.0.1 だけで待ち受けるので、Pod IP に接続する tcpSocket probe は使えない。Pod 内から確認する
      startupProbe:
        exec:
          command: ["bash", "-c", "</dev/tcp/127.0.0.1/9911"]
        periodSeconds: 2
        failureThreshold: 30
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: bin
          mountPath: /opt/bin
  extraVolumes:
    - name: certs
      secret:
        secretName: external-secrets-aws-cert
    - name: bin
      emptyDir: {}
