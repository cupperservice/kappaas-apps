# 開発クラスタ（altair）用（values.yaml に重ねる）
grafanaExternal:
  host: grafana-dev.local
  secretKey: kappaas-apps/monitoring-dev/grafana

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 4GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 5Gi
  grafana:
    # 2026-11-25: altair の OS ディスクは HDD で、再起動後に Grafana が 35MB/s 前後を読み続けて
    # ディスクが飽和し（iowait 60〜70%）、etcd が遅れて kube-apiserver が再起動を繰り返した。
    # 原因を調べるまで開発では止める。PVC も消える（PV は Retain なので altair の /var/openebs/local にデータは残る。戻すと新しい PV になる）
    enabled: false
    grafana.ini:
      server:
        root_url: https://grafana-dev.local
      # GitHub の OAuth App は callback URL が 1 つなので環境ごとに別（client secret は Secrets Manager）
      auth.github:
        client_id: Ov23liYSX7gDfRUSKJBd
