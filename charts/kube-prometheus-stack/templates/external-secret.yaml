# Grafana・Alertmanager の秘密情報を Secrets Manager から取る（認証は ESO コントローラーのサイドカー。docs/operations/aws-iam.md）
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitoring-secret-store
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: monitoring-secret-store
    kind: SecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        admin-user: admin
        admin-password: "{{ `{{ .adminpassword }}` }}"
        github-client-secret: "{{ `{{ .githubclientsecret }}` }}"
  data:
    - secretKey: adminpassword
      remoteRef:
        key: {{ required "grafanaExternal.secretKey" .Values.grafanaExternal.secretKey }}
        property: admin-password
    - secretKey: githubclientsecret
      remoteRef:
        key: {{ .Values.grafanaExternal.secretKey }}
        property: github-client-secret
---
# Slack の Incoming Webhook の URL。Alertmanager の alertmanagerSpec.secrets でマウントする
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: monitoring-secret-store
    kind: SecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: {{ required "alertmanagerExternal.secretKey" .Values.alertmanagerExternal.secretKey }}
        property: slack-webhook-url
