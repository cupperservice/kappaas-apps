# prod / dev 共通の値。環境ごとの値は prod/values.yaml・dev/values.yaml
# 運用は docs/operations/monitoring.md

# このチャートの templates/ が使う値（Grafana の公開と秘密情報）
grafanaExternal:
  # Contour の HTTPProxy のホスト名・Certificate の dnsNames（環境ごと）
  host: ""
  # Secrets Manager のシークレット名（環境ごと）。中身は JSON の github-client-secret・admin-password
  secretKey: ""

# Alertmanager の通知先（Slack）の秘密情報
alertmanagerExternal:
  # Secrets Manager のシークレット名（環境ごと）。中身は JSON の slack-webhook-url
  secretKey: ""

kube-prometheus-stack:
  # アラートを Slack に通知する。Webhook URL は Secret alertmanager-slack（templates/external-secret.yaml）
  alertmanager:
    enabled: true
    alertmanagerSpec:
      # /etc/alertmanager/secrets/alertmanager-slack/url にマウントされる
      secrets:
        - alertmanager-slack
      # 通知の抑止（silence）は Pod の再起動で消える（PV は使わない）
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: slack
        group_by: [alertname, instance]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # 常に発火している生存確認（Watchdog）と、通知不要のもの
          - receiver: "null"
            matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
          - receiver: "null"
            matchers:
              - severity =~ "none|info"
      # critical が出ている間は、同じ対象の warning を送らない
      inhibit_rules:
        - source_matchers:
            - severity = "critical"
          target_matchers:
            - severity = "warning"
          equal: [namespace, alertname]
      receivers:
        - name: "null"
        - name: slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
              send_resolved: true
              title: '[{{ .Status | toUpper }}] {{ .CommonLabels.cluster }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
              text: |-
                {{ range .Alerts }}• {{ with .Labels.instance }}{{ . }} {{ end }}{{ with .Annotations.summary }}{{ . }}{{ else }}{{ .Annotations.description }}{{ end }}
                {{ end }}

  # Mac の SMC の誤動作（センサーが 100℃ 前後を報告 → ファン最大・CPU を約 220 MHz に減速）を検知する
  # 手順は docs/operations/nodes.md
  # 誤動作中はノードが重すぎて値が取れず欠損し、発火しないことがある（標準の KubeNodeNotReady・TargetDown も合わせて見る）
  additionalPrometheusRulesMap:
    node-smc:
      groups:
        - name: node-smc
          rules:
            - alert: NodeSmcTemperatureHigh
              # TC0F・TC0E・TCXC（CPU）・TPCD（チップセット）。正常時は 40〜50℃
              expr: |
                max by (instance, label) (
                  node_hwmon_temp_celsius
                  * on (chip, sensor, instance) group_left (label)
                  node_hwmon_sensor_label{label=~"TC0F|TC0E|TCXC|TPCD"}
                ) > 90
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} の SMC 温度 {{ $labels.label }} が {{ $value }}℃"
                description: SMC の誤動作で CPU が強制減速されている可能性。docs/operations/nodes.md の「SMC による CPU の強制減速」を参照
            - alert: NodeSmcFanHigh
              # 正常時は最低の約 1,800 rpm、最大は 4,800 rpm
              expr: node_hwmon_fan_rpm > 4000
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.instance }} のファンが {{ $value }} rpm"
                description: SMC の誤動作で CPU が強制減速されている可能性。docs/operations/nodes.md の「SMC による CPU の強制減速」を参照

  # kubeadm の既定では etcd・scheduler・controller-manager・kube-proxy のメトリクスは 127.0.0.1 でしか待ち受けておらず取れない
  # 常に Down のターゲットを作らないよう無効にする（有効化はノード側の設定変更が必要）
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeProxy:
    enabled: false

  prometheus:
    prometheusSpec:
      # このチャート以外（他の chart）が作る ServiceMonitor・PodMonitor・PrometheusRule も拾う
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      # 保持期間・容量（retention・retentionSize・storage）は環境ごと
      # ノードのローカルディスク（charts/openebs-localpv）。PV はノードに固定される
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: openebs-hostpath
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          memory: 2Gi

  grafana:
    # UI で作ったダッシュボードなどを残す（SQLite）。2 つの Pod から同時に開かないよう Recreate
    persistence:
      enabled: true
      storageClassName: openebs-hostpath
      size: 2Gi
    deploymentStrategy:
      type: Recreate
    # ローカルの admin（緊急用）。Secret grafana-secrets は templates/external-secret.yaml が作る
    admin:
      existingSecret: grafana-secrets
      userKey: admin-user
      passwordKey: admin-password
    # GitHub の OAuth App の client secret を環境変数で渡す
    envValueFrom:
      GF_AUTH_GITHUB_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-secrets
          key: github-client-secret
    # helm test 用の Pod は作らない
    testFramework:
      enabled: false
    grafana.ini:
      # 利用統計の送信・更新確認をしない
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      # ID・パスワードのログインフォームを出さない（GitHub ログインだけ）。緊急用の admin は API（Basic 認証）でのみ使える
      auth:
        disable_login_form: true
      # server.root_url・auth.github.client_id は環境ごと
      auth.github:
        enabled: true
        allow_sign_up: true
        # read:org が無いと Grafana がチーム一覧（/user/teams）を取れず、ログインが InternalError で失敗する
        scopes: user:email,read:org
        # GitHub アカウント cupperservice だけ Admin。それ以外は role が空になり、role_attribute_strict でログインを拒否する
        role_attribute_path: "[login=='cupperservice'][0] && 'Admin' || ''"
        role_attribute_strict: true
    # 初回起動時は DB の migration に数分かかり、既定（約 160 秒）だと liveness で再起動される。約 6 分待つ
    livenessProbe:
      failureThreshold: 30
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
