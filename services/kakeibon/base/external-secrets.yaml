apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kakeibon-secret-store
  namespace: kakeibon
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      # auth:
      # aws credential helperを使用するため、認証情報は空にする
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kakeibon-ghcr-secret
  namespace: kakeibon
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: kakeibon-secret-store
    kind: SecretStore
  target:
    name: kakeibon-ghcr-secret
    template:
      engineVersion: v2
      metadata:
        annotations:
          accurate.cybozu.com/propagate: update
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: kappaas-apps/ghcr/github-personal-access-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kakeibon-backend-secret
  namespace: kakeibon
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: kakeibon-secret-store
    kind: SecretStore
  target:
    name: kakeibon-backend-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        JWT_SECRET: "{{ .jwt }}"
  # 取得元（spec.data）は環境ごとに違うので overlays/<env>/patches/external-secrets-patch.yaml
